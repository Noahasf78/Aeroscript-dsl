<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: #0d1117; rx: 8px; }
    .axis { stroke: #30363d; stroke-width: 1.5; }
    .grid { stroke: #21262d; stroke-width: 1; stroke-dasharray: 4,4; }
    .path-line { stroke: #58a6ff; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .return-line { stroke: #3fb950; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
    .point-base { fill: #3fb950; filter: url(#glow); }
    .point-wp { fill: #58a6ff; filter: url(#glow); }
    .title { font-family: monospace; font-size: 13px; fill: #f0f6fc; font-weight: bold; letter-spacing: 0.5px; }
    .meta { font-family: monospace; font-size: 11px; fill: #8b949e; }
    .axis-label { font-family: monospace; font-size: 11px; fill: #8b949e; }
    .coord-title { font-family: monospace; font-size: 12px; fill: #f0f6fc; font-weight: bold; }
    .coord-sub { font-family: monospace; font-size: 11px; fill: #8b949e; }
  </style>

  <!-- Bakgrunn -->
  <rect width="780" height="400" class="bg" stroke="#30363d" stroke-width="1"/>

  <!-- Header / Metadata -->
  <text x="35" y="38" class="title">AEROSCRIPT 2D TOP-DOWN TRAJECTORY PLOT</text>
  <text x="35" y="58" class="meta">Source: examples/recon_patrol.aero // Telemetry: Main.java simulation</text>
  <text x="510" y="38" class="meta">Total Vector: 220.00 m</text>
  <text x="510" y="58" class="meta">Cruise Altitude: 30.0 m (Z-axis)</text>

  <!-- Akser (Origo x=120, y=310) -->
  <line x1="120" y1="310" x2="690" y2="310" class="axis"/>
  <line x1="120" y1="310" x2="120" y2="90" class="axis"/>

  <!-- Rutenett (X: 0, 30, 60 | Y: 0, 20, 40) -->
  <line x1="380" y1="90" x2="380" y2="310" class="grid"/>
  <line x1="640" y1="90" x2="640" y2="310" class="grid"/>
  <line x1="120" y1="200" x2="640" y2="200" class="grid"/>
  <line x1="120" y1="90" x2="640" y2="90" class="grid"/>

  <!-- Aksetekster -->
  <text x="120" y="332" class="axis-label" text-anchor="middle">0</text>
  <text x="380" y="332" class="axis-label" text-anchor="middle">30</text>
  <text x="640" y="332" class="axis-label" text-anchor="middle">60</text>
  <text x="700" y="314" class="axis-label">X: East (m)</text>
  <text x="105" y="314" class="axis-label" text-anchor="end">0</text>
  <text x="105" y="204" class="axis-label" text-anchor="end">20</text>
  <text x="105" y="94" class="axis-label" text-anchor="end">40</text>
  <text x="120" y="75" class="axis-label">Y: North (m)</text>

  <!-- Flyrute (0,0 -> 30,40 -> 60,0 -> 0,0) -->
  <path d="M 120 310 L 380 90 L 640 310" class="path-line"/>
  <path d="M 640 310 L 120 310" class="return-line"/>

  <!-- Noder -->
  <circle cx="120" cy="310" r="6" class="point-base"/>
  <circle cx="380" cy="90" r="5" class="point-wp"/>
  <circle cx="640" cy="310" r="5" class="point-wp"/>

  <!-- Node-tekster: Base Station (flyttet opp over linjen) -->
  <text x="135" y="270" class="coord-title">Base Station (0.0, 0.0)</text>
  <text x="135" y="286" class="coord-sub">Takeoff: 97.00% | Dock: 78.00% bat</text>

  <!-- Node-tekster: Alpha -->
  <text x="395" y="85" class="coord-title">Waypoint Alpha (30.0, 40.0)</text>
  <text x="395" y="100" class="coord-sub">Alt: 30m | Bat: 92.00% | 80m cum.</text>

  <!-- Node-tekster: Bravo (plassert trygt over den skrå blå linjen) -->
  <text x="505" y="250" class="coord-title">Waypoint Bravo (60.0, 0.0)</text>
  <text x="505" y="265" class="coord-sub">Alt: 30m | Bat: 87.00% | 130m cum.</text>
  <text x="505" y="280" class="coord-sub" fill="#3fb950">--- Return To Base trajectory</text>
</svg>
